<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英検2級 スピーキング SCBT模試</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Top Navigation Links */
        header {
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 시험 회차 선택 드롭다운 스타일 */
        .exam-select {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: #f8f9fa;
            color: #333;
            cursor: pointer;
        }
        .exam-select:focus {
            outline: none;
            border-color: #3b71ca;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }
        .nav-link {
            padding: 6px 14px;
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            text-decoration: none;
            transition: background 0.2s;
        }
        .nav-link.active {
            background-color: #3b71ca;
            color: white;
            border-color: #3b71ca;
        }
        .nav-link:hover {
            background-color: #dde2e6;
        }
        .nav-link.active:hover {
            background-color: #385998;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Left Panel */
        .left-panel {
            flex: 1.3;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #212529;
            border-bottom: 4px solid #adb5bd;
            padding-bottom: 8px;
        }
        .content-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* Image Card Styles */
        .card-image-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            overflow: hidden;
            padding: 10px;
        }
        .card-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Right Panel */
        .right-panel {
            flex: 0.7;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
            align-items: center;
        }
        .audio-control-bar {
            width: 100%;
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .audio-label {
            font-size: 14px;
            font-weight: bold;
        }
        .volume-slider {
            flex: 1;
            accent-color: #51cf66;
        }
        .volume-indicator {
            width: 15px;
            height: 15px;
            background-color: #51cf66;
            border-radius: 50%;
        }

        .interviewer-container {
            text-align: center;
            margin: 20px 0;
            width: 100%;
        }
        .interviewer-img-box {
            width: 220px;
            height: 180px;
            border: 1px solid #ced4da;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .mic-icon-container {
            width: 110px;
            height: 110px;
            border: 3px solid #ced4da;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            position: relative;
        }
        .mic-icon {
            font-size: 40px;
            color: #adb5bd;
        }
        
        .timer-badge {
            position: absolute;
            bottom: -14px;
            background: #3b71ca;
            color: white;
            padding: 4px 14px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: none;
        }

        /* Yes/No Buttons */
        .yes-no-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 80%;
            margin-bottom: 15px;
        }
        .choice-btn {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ced4da;
            background: #e2e3e5;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .choice-btn:hover {
            background: #d6d8db;
        }
        .choice-btn.selected {
            background: #3b71ca;
            color: white;
            border-color: #3b71ca;
        }

        /* Footer Controls */
        .footer-controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
        }
        .control-btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-before {
            background-color: #6c757d;
            color: white;
        }
        .btn-before:hover {
            background-color: #5a6268;
        }
        .btn-next {
            background-color: #4a77bc;
            color: white;
        }
        .btn-next:hover {
            background-color: #3b609c;
        }
        .control-btn:disabled {
            background-color: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <select class="exam-select" id="examSelect" onchange="changeExamSession()">
                <option value="session1">스피킹 - 2025년 2회</option>
                <option value="session2">스피킹 - 2025년 2회-1</option>
            </select>
        </div>
        <div class="nav-links" id="navLinks">
            <div class="nav-link active" onclick="goToStep(0)">音読</div>
            <div class="nav-link" onclick="goToStep(1)">No. 1</div>
            <div class="nav-link" onclick="goToStep(2)">No. 2 (黙読)</div>
            <div class="nav-link" onclick="goToStep(3)">No. 2 (スピーチ)</div>
            <div class="nav-link" onclick="goToStep(4)">No. 3</div>
            <div class="nav-link" onclick="goToStep(5)">No. 4</div>
        </div>
    </header>

    <div class="main-container">
        <!-- Left Panel: Large Image Card -->
        <div class="left-panel">
            <div class="section-title" id="leftSectionTitle">音読</div>
            <div class="content-box" id="leftContent">
                <div class="card-image-wrapper">
                    <img id="cardImage" src="202502.png" alt="문제 카드 이미지">
                </div>
            </div>
        </div>

        <!-- Right Panel: Audio, Interviewer, Timer, Buttons -->
        <div class="right-panel">
            <div class="audio-control-bar">
                <span class="audio-label">音声音量</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" oninput="updateVolume()">
                <div class="volume-indicator"></div>
            </div>

            <div class="interviewer-container">
                <div class="interviewer-img-box">
                    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div id="dynamicMiddleArea">
                    <div class="mic-icon-container" id="micContainer">
                        <svg class="mic-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        <div class="timer-badge" id="timerBadge">20</div>
                    </div>
                </div>
            </div>

            <div class="footer-controls">
                <button class="control-btn btn-before" id="beforeBtn" onclick="prevStep()">
                    &lt; もう一度聞いてやりなおす
                </button>
                <button class="control-btn btn-next" id="nextBtn" onclick="nextStep()">
                    次へ &gt;
                </button>
            </div>
        </div>
    </div>

<script>
    let currentStep = 0;
    let timerInterval = null;
    let timeLeft = 0;
    let currentVolume = 0.8;
    let currentSession = 'session1'; // 기본값: 2025년 2회

    // 회차별 데이터 정의 (이미지 파일명 변경 반영)
    const examData = {
        session1: {
            image: "202502.png",
            steps: [
                {
                    title: "音読",
                    type: "image",
                    instruction: "Please read the passage silently for 20 seconds.",
                    timer: 20
                },
                {
                    title: "No. 1",
                    type: "image", 
                    instruction: "According to the passage, how will passengers travel faster and quieter than in the past?",
                    timer: 40
                },
                {
                    title: "No. 2 (黙読)",
                    type: "image",
                    instruction: "Now, please look at the picture and describe the situation. You have 20 seconds to prepare. Your story should begin with the sentence on the card.",
                    timer: 20
                },
                {
                    title: "No. 2 (スピーチ)",
                    type: "image",
                    instruction: "Please begin.",
                    timer: 60
                },
                {
                    title: "No. 3",
                    type: "blank", 
                    interstitialText: "Now, Mr. / Ms. ――, please turn over the card and put it down.",
                    instruction: "Some people say that trains are a better way to travel than airplanes. What do you think about that?",
                    timer: 35
                },
                {
                    title: "No. 4",
                    type: "blank", 
                    instruction: "Today, many movies have violent scenes. Do you think people should stop making these movies?",
                    hasChoices: true,
                    timer: 35
                }
            ]
        },
        session2: {
            image: "202502-1.png",
            steps: [
                {
                    title: "音読",
                    type: "image",
                    instruction: "Please read the passage silently for 20 seconds.",
                    timer: 20
                },
                {
                    title: "No. 1",
                    type: "image", 
                    instruction: "According to the passage, how can some consumers help protect the environment?",
                    timer: 40
                },
                {
                    title: "No. 2 (黙読)",
                    type: "image",
                    instruction: "Now, please look at the picture and describe the situation. You have 20 seconds to prepare. Your story should begin with the sentence on the card.",
                    timer: 20
                },
                {
                    title: "No. 2 (スピーチ)",
                    type: "image",
                    instruction: "Please begin.",
                    timer: 60
                },
                {
                    title: "No. 3",
                    type: "blank", 
                    interstitialText: "Now, Mr. / Ms. ――, please turn over the card and put it down.",
                    instruction: "Some people say that the government should do something to increase the number of young farmers in Japan. What do you think about that?",
                    timer: 35
                },
                {
                    title: "No. 4",
                    type: "blank", 
                    instruction: "Today, some cities ask people to use buses and trains instead of cars. Do you think more cities will do this in the future?",
                    hasChoices: true,
                    timer: 35
                }
            ]
        }
    };

    function updateVolume() {
        const slider = document.getElementById('volumeSlider');
        currentVolume = slider.value / 100;
    }

    function changeExamSession() {
        const select = document.getElementById('examSelect');
        currentSession = select.value;
        currentStep = 0;
        renderStep();
    }

    function renderStep() {
        clearInterval(timerInterval);
        document.getElementById('timerBadge').style.display = 'none';

        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach((link, idx) => {
            if (idx === currentStep) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });

        const session = examData[currentSession];
        const step = session.steps[currentStep];
        document.getElementById('leftSectionTitle').innerText = step.title;

        const leftContent = document.getElementById('leftContent');
        
        if (step.type === 'image') {
            leftContent.innerHTML = `
                <div class="card-image-wrapper">
                    <img src="${session.image}" alt="문제 카드 이미지">
                </div>
            `;
        } else if (step.type === 'blank') {
            leftContent.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6c757d; font-size: 18px; text-align: center; border: 2px dashed #dee2e6; border-radius: 8px; padding: 40px; width: 100%;">
                    <p>🎧 面接官の質問をよく聞いて答えてください</p>
                    <p style="font-size: 14px; margin-top: 10px; color: #adb5bd;">(この問題ではカードを伏せます)</p>
                </div>
            `;
        }

        const middleArea = document.getElementById('dynamicMiddleArea');
        if (step.hasChoices) {
            middleArea.innerHTML = `
                <div class="yes-no-container">
                    <button class="choice-btn" id="yesBtn" onclick="selectChoice('yes')">Yes</button>
                    <button class="choice-btn" id="noBtn" onclick="selectChoice('no')">No</button>
                </div>
                <div class="mic-icon-container" id="micContainer">
                    <svg class="mic-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <div class="timer-badge" id="timerBadge">35</div>
                </div>
            `;
        } else {
            middleArea.innerHTML = `
                <div class="mic-icon-container" id="micContainer">
                    <svg class="mic-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <div class="timer-badge" id="timerBadge">${step.timer}</div>
                </div>
            `;
        }

        document.getElementById('beforeBtn').disabled = (currentStep === 0);
        document.getElementById('nextBtn').innerText = (currentStep === session.steps.length - 1) ? "終了する >" : "次へ >";

        if (step.interstitialText) {
            speakText(step.interstitialText, () => {
                speakText(step.instruction, () => {
                    startTimer(step.timer);
                });
            });
        } else {
            speakText(step.instruction, () => {
                startTimer(step.timer);
            });
        }
    }

    function speakText(text, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.volume = currentVolume;

            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => 
                v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Enhanced') || v.name.includes('Samantha') || v.name.includes('Zira'))
            ) || voices.find(v => v.lang.includes('en-US')) || voices[0];

            if (preferredVoice) {
                utterance.voice = preferredVoice;
            }

            utterance.onend = () => {
                if (callback) callback();
            };
            window.speechSynthesis.speak(utterance);
        } else {
            if (callback) callback();
        }
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    function startTimer(seconds) {
        timeLeft = seconds;
        const badge = document.getElementById('timerBadge');
        if (!badge) return;
        badge.style.display = 'block';
        badge.innerText = timeLeft;

        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                badge.innerText = timeLeft;
            } else {
                clearInterval(timerInterval);
                badge.style.display = 'none';
            }
        }, 1000);
    }

    function nextStep() {
        const session = examData[currentSession];
        if (currentStep < session.steps.length - 1) {
            currentStep++;
            renderStep();
        } else {
            alert('テストが終了しました。お疲れ様でした！');
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            renderStep();
        }
    }

    function goToStep(stepIndex) {
        currentStep = stepIndex;
        renderStep();
    }

    function selectChoice(choice) {
        document.getElementById('yesBtn').classList.remove('selected');
        document.getElementById('noBtn').classList.remove('selected');
        
        if (choice === 'yes') {
            document.getElementById('yesBtn').classList.add('selected');
            speakText("Why?", () => {
                startTimer(35);
            });
        } else {
            document.getElementById('noBtn').classList.add('selected');
            speakText("Why not?", () => {
                startTimer(35);
            });
        }
    }

    window.onload = () => {
        renderStep();
    };
</script>

</body>
</html>
