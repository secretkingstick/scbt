<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メインメニュー</title>
<style>
    /* 全体のスタイル（背景色やフォント） */
    body {
        font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    /* メニューを囲む白いボックスのスタイル */
    .menu-container {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        text-align: center;
        width: 90%;
        max-width: 400px;
    }
    h1 {
        color: #2c3e50;
        margin-top: 0;
        margin-bottom: 25px;
    }
    /* リストの点（・）を消す */
    ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
    }
    li {
        margin-bottom: 15px;
    }
    /* ボタン（リンク）のスタイル */
    a {
        display: block;
        padding: 15px 20px;
        background-color: #3498db;
        color: #ffffff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 1.1em;
        font-weight: bold;
        transition: background-color 0.2s ease;
    }
    /* マウスを乗せたときに色を少し濃くする */
    a:hover {
        background-color: #2980b9;
    }
</style>
</head>
<body>

<div class="menu-container">
    <h1>メニュー</h1>
    <ul>
        <!-- href="..." の部分にリンク先のファイル名やURLを入れます -->
        <li><a href="eigo/gk.html">L5-7-11-Grammer&KPT</a></li>
    </ul>
</div>
</body>
</html>
