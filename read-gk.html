【Lesson 7-Read】 
日本の食料廃棄
Food Waste in Japan
①
みなさん、こんにちは。今日は日本の食料廃棄という深刻な問題についてお話ししたいと思います。
Hello, everyone.Today, I would like to talk about the serious problems of food waste in Japan.
この話が終わる時には、みなさんがこの話題についていっそう関心を持ってくれることを願います。
By the end of this talk, I hope you will be more interested in the topic.
まず、この写真を見てください。
First, please take a look at this picture.
これはごみ容器に入った大量の恵方巻の写真です。
It is a picture of a large amount of ehomaki in a garbage container.
節分のあとに店や工場がそれらを廃棄しました。
Stores and factories threw them away after setsubun.
ソーシャルメディアでこの写真が表示されると、多くの人にショックを与えました。
Social media showed this picture and it shocked many people.
これまでにこのような写真を見たことがありますか。
Have you seen this kind of photo before?
これは「食料廃棄」の典型的な事例です。食べられるにもかかわらず食料が廃棄されているのです。
This is a typical case of "food waste"; food is thrown away even though it can be eaten.
日本における2019年の食料廃棄の総量は600万トンを超えました。
The total amount of food waste in 2019 in Japan was over six million tons!
それは1人あたり年におよそ50キログラムになります。
That's about 50 kilograms per person in a year.
次に、このグラフをご覧ください。
Next, please take a look at this chart.
食料廃棄の半分以上が工場や店、レストランなど食品産業から発生しています。
More than half the food waste comes from the food industry, such as factories, stores and restaurants.
残りは個人の家庭からです。
The rest comes from individual homes.
日本政府は食料廃棄を減らそうと努力してきています。
The Japanese government has been trying to reduce food waste.
しかし、レストランのオーナーは、以前より提供する料理の量を減らすと顧客を失うのではないかと心配しています。
But restaurant owners are worried about losing customers if they don't serve as much food as before.
ですから、彼らはたくさんの料理を提供し続けます。
So they continue to serve a lot of food.
家庭では、人々は「新鮮さ」が重要だと信じて、まだ食べられるのにもかかわらず、古い食品を買ったり使ったりすることを避けます。
At home, people believe that "freshness" is important, so they avoid buying or using old food though it can still be eaten.
このような行動によってたくさんの食品が廃棄されるのです。
Because of these actions, a lot of food is thrown away.
②
しかしながら、人々の考え方は少しずつ変化しているかもしれません。
However, people's thinking may be changing little by little.
恵方巻のショッキングな写真を見たあと、人々は食料廃棄をより意識するようになりました。
After people saw the shocking photo of the ehomaki, they became more aware of food waste.
廃棄を減らすために、2月の恵方巻や7月のうなぎなど、大量の食品を販売するのをやめた店もあります。
In order to reduce waste, some stores have stopped selling so much food, such as ehomaki in February or unagi in July.
また、大手コンビニエンスストアでは、賞味期限の直前に割引価格でおにぎりや弁当、サンドウィッチを売るようになっています。
Also, major convenience stores have been selling rice balls, lunchboxes and sandwiches at discount prices just before their best before date.
さらに、日本ではさまざまな事業が始まっています。
In addition, Japan has started to introduce various programs.
この事業の1つが「食品ロス削減国民運動」です。
One of these programs is the "NO-FOODLOSS PROJECT."
「ろすのん」というキャラクターがついたユニークなロゴを用いて、人々にこの深刻な事態を伝えようと試みています。
By using unique logos with the "loss-non" character, they are trying to inform people about this serious situation.
③
最後に、フードバンクやモバイルアプリなど、その他の計画についてお話ししたいと思います。
Lastly, I would like to talk about other projects such as food banks and mobile apps.
セカンドハーベストジャパンは日本で最初の全国的なフードバンクです。
Second Harvest Japan is Japan's first nationwide food bank.
余った食品を回収してそれを困っている人に提供しています。
They collect surplus food and provide it to people in need.
また、東京や他の地域に「ピックアップロケーション」を増やそうともしています。
They are also trying to increase "pick-up locations" in Tokyo and other areas.
この仕組みを通じて、人々はいつでも近くの警察署や消防署、病院などの場所で食料を受け取ることができます。
Through this system, people can pick up food at any time from places such as a nearby police station, fire station or hospital.
彼らの目標は年間10万人を支援することです！
Their goal is to support 100,000 people a year!
日本もったいない食品センターも同様の組織です。
The Mottainai Food Center is a similar organization.
日本語の「もったいない」という言葉は廃棄を遺憾に思う感覚を表します。
The Japanese word mottainai expresses a sense of regret about waste.
センターは店や食品メーカーから余った食品を回収したり購入したりします。
The center collects or buys surplus food from stores and food makers.
それからこの食料を支援団体や困っている人々に提供します。
Then they give this food to support groups and to people in need.
もしそれらについてもっと知りたいと思ったら、これらのフードバンクのウェブサイトをご覧ください！
Please look at the websites of these food banks if you want to learn more about them!
主要都市で利用されているモバイルアプリもあります。
Some mobile apps are also used in major cities.
店やレストランが余った食品の写真と値段を投稿します。すると人々は来店して、割引価格でその食品を購入します。
Stores and restaurants post pictures and prices of surplus food, and people come and buy the food at discount prices.
これらのプロジェクトは日本の深刻な食料廃棄問題を減らすのに役立っています。
These projects are helping to reduce Japan's serious food waste problem.
廃棄を減らすために、私たちすべてが自分のできる役割を行う必要があります。
We all need to do our part to reduce waste.
小さな一歩が非常に大きな前進につながります。
One small step can lead to great progress.
さあ、今日から始めて変えましょう！
So let's start today and make a difference!
ご清聴ありがとうございました。
Thank you for listening.

【Lesson 11-Read】
協力するAIと人間
AI and Man Working Together
①
今年が2050年であると想像してみましょう。
Imagine that it is the year 2050.
あなたはサッカーワールドカップの決勝戦を観戦しています。
You are watching the Soccer World Cup final.
それはわくわくする試合です。
It is an exciting game.
ブラジルは世界でいちばんのチームであなたは彼らに勝ってほしいと思っています。
Brazil is the number one team in the world and you want them to win.
しかし結局彼らは負けます。
In the end though, they lose.
彼らはもう一方のチームを破るほど強くないのです。
They are not strong enough to beat the other team.
勝者はロボットチームです。
The winner is the robot team.
彼らは世界でいちばんの人間のアスリートチームを破ったのです。
They have beaten the best human sports team in the world.
もちろん、これは実現しないでしょう。
Of course, this will not come true.
それとも実現するでしょうか。
Or will it?
実は、それは1992年に始まったロボットのサッカーリーグ、「ロボカップ」の目標なのです。
In fact, that is the goal of "RoboCup," a robot soccer league which began in 1992.
②
2017年に発表された調査によると、2060年までにほとんどの作業でコンピューターが局間に勝ると考えている研究者もいます。
According to a survey published in 2017, some researchers think that computers will be better than humans at most tasks by 2060.
例えば、2024年までに言語の翻訳で、2027年までにトラックの運転で、2053年までに手術の執刀で、コンピューターは局間に打ち勝つのに十分な能力を持つだろうと彼らは考えているのです。
For example, they think that computers will be powerful enough to beat humans at translating languages by 2024, driving trucks by 2027 and performing surgery by 2053.
実際、コンピューターはいくつかの作業ですでに人間より優れています。
In fact, computers are already better than humans at some tasks.
1980年代の後半に、コンピューター会社であるIBMの科学者がチェスをするコンピューターのプログラミングを始めました。
In the late 1980s, scientists at the computer company IBM began to program a computer to play chess.
彼らはそれを「ディープ・ブルー」と呼びました。
They called it "Deep Blue."
1996年にIBMは世界で最も有名なチェスの競技者であるガルリ・カスパロフに、ディープ・ブルーと対戦することを依頼しました。
In 1996, IBM invited the most famous chess player in the world, Garry Kasparov, to play against Deep Blue.
カスパロフはその対戦に勝利しました。
Kasparov won the match.
翌年、IBMはカスパロフに再度の対戦を要請しました。
The following year, IBM asked Kasparov to play again.
カスパロフは自分が再び勝つだろうと信じていました。
Kasparov believed that he would win again.
しかし、1997年には、ディープ・ブルーは以前より強くなっていました。
But in 1997, Deep Blue was stronger than before.
今や1秒間に2億回の数学的計算ができました。
It could now do 200 million math calculations per second.
このスピードのおかげでどの手を打つべきかすばやくわかりました。
Thanks to this speed, it could quickly understand which move to make.
今回はディープ・ブルーが対戦に勝利しました。
This time, Deep Blue won the match.
それはコンピューターの人間に対する勝利であり、AI時代の幕開けでした。
It was a victory of computers over man and the beginning of the AI age.
③
このできごとは多くの人々にショックを与えましたが、AIは社会にとって非常に役立つであろうことに科学者たちはすぐに気づきました。
Although this event shocked many people, scientists soon realized that AI could be very useful to society.
コンピューターには多くの種類の作業の方法を教え込むことができるのです。
Computers could be taught how to do many kinds of tasks.
1つの重要な例は病院でのAIの利用です。
One important example is the use of AI in hospitals.
医師にとって、何時間もの間レントゲン画像の確認をすることはたいてい大変なことで、それぞれのレントゲン画像を確認することはしばしば時間がかかります。
It is usually hard for doctors to check X-rays for many hours, and it often takes time for them to check each X-ray.
しかし、大量のレントゲン画像のデータを記憶させておくことによって、コンピュータープログラムはレントゲン画像を見て患者が病気である可能性を判断することができるようになります。
But by storing a large amount of X-ray data, computer programs can learn to look at X-rays and tell that a patient may be sick.
教育プログラムはレントゲン画像を迅速にチェックできます。
These programs can check X-rays very quickly.
そして、人間とは違ってコンピュータープログラムは疲れません。
And, unlike people, they do not become tired.
これらのプログラムを利用することによって、医師は深刻な病気を発見するのにかかる時間を大幅に節約することができます。
By using these programs, doctors can save a lot of time in finding serious diseases.
④
進化したAI技術の助けを借りて、ロボットサッカーチームはいつか人間の最強のチームを破ることができるかもしれません。
With the help of advanced AI technology, the robot soccer team may be able to beat the best human team one day.
進化したAI技術は社会における多くの方面でも利用される可能性があります。
Advanced AI technology can also be used in many ways in society.
例えば、ロボット義手やロボット義足を、それらを必要とする人々ーのために開発することができるでしょう。
For example, we can develop robotic arms or legs for people who need them.
または、電話に出たり、会合に出席さえするような、私たちの代わりに特定の仕事をしてくれるデジタルクローンを作り出すこともできるでしょう。
Or we can create digital clones to do certain work for us such as answering phones or even attending a meeting.
そうすると、私たちは本当にしたいことや私たちにしかできないことに集中することができます。
Then we can focus on things that we really want to do, or things that only we can do.
ですから、私たちは21世紀が人間とAIの戦いの時代だと考えるべきではないでしょう。
So we shouldn't think that the twenty-first century will be an age of battles between humans and AI.
むしろ、人間とAIが協力して世界をより良い場所にしていくでしょう。
Rather, humans and AI will work together to make the world a better place.
太古の昔から、私たちは常に自分たちの生活を改善していくために技術を用いてきました。
Since the beginning of time, we have always used technology to improve our lives,
そして、将来もそれを続けていくでしょう。
and we will continue to do so in the future.
人間とAIは味方同士なのです。
Humans and AI are on the same team.

ディズニーとジブリが世界を魅了する
【Lesson 5 Read】 Disney and Ghibli Fascinate the World
佐藤先生: 本日は、キャシーとアキラが発表を行います。
Mr. Sato: Today, Kathy and Akira are going to give a presentation.
彼らは有名なアニメーションスタジオの（制作）費用、歴史、様式について話します。
They are going to talk about the cost, history and style of famous animation studios.
キャシー、始めてください。
Kathy, please start.
キャシー: ありがとうございます、佐藤先生。
Kathy: Thank you, Mr. Sato.
私は最も有名なアニメーションスタジオの1つであるディズニーについてお話しします。
I'm going to talk about one of the most famous animation studios, Disney.
きっとみなさんには少なくとも1本のお気に入りのディズニー映画があると思います。
I'm sure that you all have at least one favorite Disney movie.
私のいちばん好きなディズニー映画は「アナと雪の女王」です。
Mine is Frozen.
ディズニーには100年近くの長い歴史があります。
Disney has a long history, almost a hundred years.
彼らは非常に大きな規模で映画を作っています。
They make movies on a very large scale.
今日のディズニー映画の制作費は1億ドルを超えています。
A Disney movie today costs over 100 million dollars to produce.
例えば、スタジオは「塔の上のラプンツェル」の制作に約2億6,000万ドルを費やしました。
For example, the studio spent about 260 million dollars to produce Tangled.
もちろん、彼らは大きな売り上げも上げています。
Of course, they make big sales, too.
ディズニーの人気映画の多くは収入10億ドル超えです。
Many of Disney's popular movies make over a billion dollars.
次に、彼らの様式を見てみましょう。
Next, let's take a look at their style.
ディズニーの映画は主に子供向けです。
Disney's movies are mainly for children.
主人公は個性的で正義感が強いことが多いです。
The main characters are often unique and have a strong sense of justice.
物語のメインテーマは悪者に立ち向かうことです。
The main theme of the stories is standing up against the bad guys.
それは単純でわかりやすいです。
It is simple and clear.
また、成功と成長は非常に重要なテーマです。
Also, succeeding and growing up are very important themes.
子供たちは登場人物を尊敬し、よく彼らに親しみを感じます。
Children respect the characters and often feel close to them.
私は単純さがディズニーの成功の理由の1つだと思います。
I think simplicity is one of the reasons for Disney's success.
ご清聴ありがとうございました！
Thank you for listening!
佐藤先生: ありがとう、キャシー。
Mr. Sato: Thank you, Kathy.
素晴らしかったよ！
That was excellent!
次にアキラの話を聞いてみましょう。
Next, let's hear from Akira.
アキラ: こんにちは、みなさん。
Akira: Hi, everyone.
僕はスタジオジブリについて調べてみました。
I did some research on Studio Ghibli.
彼らは1985年に活動を始め、現在日本で最も成功しているアニメーションスタジオです。
They started in 1985 and they are now the most successful animation studio in Japan.
彼らはたくさんの素晴らしい映画を作りました。そして僕は彼らの作品をとても誇りに思っています。
They created many great movies and I'm very proud of their works.
ジブリとディズニーを比較するなら、ジブリはより小さな規模で映画を作っています。
If we compare Ghibli with Disney, Ghibli makes movies on a smaller scale.
ジブリ映画の制作費は通常約1,800万〜2,800万ドルです。
A Ghibli movie usually costs about 18 to 28 million dollars to produce.
ジブリの最も人気のある映画は「千と千尋の神隠し」でした。
Ghibli's most popular movie was Spirited Away.
それは世界中で約3億ドルの（興行）収入になりました。
It made about 300 million dollars worldwide.
ジブリの様式はディズニーとは大きく異なります。
Ghibli's style is very different from that of Disney.
第1に、ジブリの映画は重くて深刻なテーマを含んでいます。
First of all, Ghibli's movies have heavy and serious themes.
ですから子供も大人も映画を見て楽しむことができます。
So both children and adults can enjoy watching them.
「風の谷のナウシカ」や「もののけ姫」のような映画を見たあとに、多くの人々が環境破壊と平和の重要性に気づきます。
After watching movies such as Nausicaä of the Valley of the Wind and Princess Mononoke, many people become aware of environmental destruction and the importance of peace.
第2に、ジブリの物語は善悪についての問題ではありません。
Secondly, Ghibli's stories are not about right or wrong.
複雑な人間の感情を描写しているのです。
They describe complex human emotions.
例えば、「千と千尋の神隠し」は、不思議な世界の独特な登場人物を描いています。
For example, Spirited Away describes unique characters in a mysterious world.

      p.className += ' section-header'; // スクロール位置調整用のクラス
      p.style.fontWeight = 'bold';
      p.style.marginTop = '20px';
      p.style.fontSize = '1.2em';
      
      // 目次ボタンの作成
      const tocBtn = document.createElement('a');
      tocBtn.className = 'toc-btn';
      tocBtn.textContent = line.replace(/【|】/g, ''); // 【 】を取り除いてスッキリ表示
      tocBtn.onclick = () => {
        // クリックされたら該当箇所へスムーズスクロール
        document.getElementById(sId).scrollIntoView({ behavior: 'smooth' });
        // その箇所から再生できるようにcurrentIndexを更新
        const targetIndex = lineData.findIndex(item => item.el === p);
        if (targetIndex !== -1) {
            currentIndex = targetIndex;
            // 再生中の場合は一度止めてからそこから再開、止まっていればハイライトだけ移動
            if (isPlaying) {
                window.speechSynthesis.cancel();
                speakNext();
            } else {
                lineData.forEach(item => item.el.classList.remove('playing'));
                p.classList.add('playing');
            }
        }
      };
      tocDiv.appendChild(tocBtn);
      sectionIndex++;
      
      contentDiv.appendChild(p);
      lineData.push({ text: line, el: p, isJp: true }); // 見出しは読まないか日本語扱い
      return; 
    }

    if (/^①$|^②$|^③$|^④$/.test(line)) {
      p.style.fontWeight = 'bold';
      p.style.marginTop = '20px';
      p.style.fontSize = '1.2em';
      contentDiv.appendChild(p);
      lineData.push({ text: line, el: p, isJp: true });
      return;
    }

    if (isJapanese(line)) {
      p.classList.add('japanese');
    } else {
      p.classList.add('english');
    }

    contentDiv.appendChild(p);
    lineData.push({ text: line, el: p, isJp: isJapanese(line) });
  });

  // 目次がない場合は枠自体を非表示
  if (sectionIndex === 0) {
      tocDiv.style.display = 'none';
  }

  // デバイスの音声リストを取得してプルダウンにセットする関数
  function populateVoiceList() {
    availableVoices = window.speechSynthesis.getVoices();
    enVoiceSelect.innerHTML = '';
    jaVoiceSelect.innerHTML = '';

    availableVoices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${voice.name} (${voice.lang})`;

      if (voice.lang.startsWith('en')) {
        enVoiceSelect.appendChild(option);
      }
      if (voice.lang.startsWith('ja')) {
        jaVoiceSelect.appendChild(option);
      }
    });

    selectBestVoice(enVoiceSelect, ['Natural', 'Online', 'Google UK', 'Google US']);
    selectBestVoice(jaVoiceSelect, ['Nanami', 'Keita', 'Natural', 'Online', 'Google 日本語']);
  }

  function selectBestVoice(selectElement, preferredNames) {
    const options = Array.from(selectElement.options);
    for (let name of preferredNames) {
      const match = options.find(opt => opt.textContent.includes(name));
      if (match) {
        selectElement.value = match.value;
        return;
      }
    }
  }

  populateVoiceList();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = populateVoiceList;
  }

  function speakNext() {
    if (!isPlaying || currentIndex >= lineData.length) {
      isPlaying = false;
      playBtn.textContent = '▶ 再生';
      return;
    }

    const currentItem = lineData[currentIndex];

    // 記号だけの行や「英語のみ」時のスキップ処理
    if (/^【.*】$|^①$\vert{}^②$|^③$\vert{}^④$/.test(currentItem.text) || (englishOnlyCheckbox.checked && currentItem.isJp)) {
      currentIndex++;
      speakNext();
      return;
    }

    lineData.forEach(item => item.el.classList.remove('playing'));
    currentItem.el.classList.add('playing');
    
    // 現在の読み上げ行を画面中央付近に自動スクロール
    currentItem.el.scrollIntoView({ behavior: 'smooth', block: 'center' });

    const utterance = new SpeechSynthesisUtterance(currentItem.text);
    utterance.rate = parseFloat(speedSelect.value);

    if (currentItem.isJp && jaVoiceSelect.value) {
      utterance.voice = availableVoices[jaVoiceSelect.value];
    } else if (!currentItem.isJp && enVoiceSelect.value) {
      utterance.voice = availableVoices[enVoiceSelect.value];
    } else {
      utterance.lang = currentItem.isJp ? 'ja-JP' : 'en-US';
    }

    utterance.onend = () => {
      currentIndex++;
      speakNext();
    };

    utterance.onerror = (e) => {
      console.warn("読み上げエラー:", e);
      currentIndex++;
      speakNext();
    };

    window.speechSynthesis.speak(utterance);
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) return;
    window.speechSynthesis.cancel();
    isPlaying = true;
    playBtn.textContent = '再生中...';
    if (currentIndex >= lineData.length) currentIndex = 0;
    speakNext();
  });

  stopBtn.addEventListener('click', () => {
    isPlaying = false;
    window.speechSynthesis.cancel();
    playBtn.textContent = '▶ 再生';
    lineData.forEach(item => item.el.classList.remove('playing'));
  });

  window.addEventListener('beforeunload', () => {
    window.speechSynthesis.cancel();
  });

</script>
</body>
</html>
