Part 1: Unit 4 — 未来表現「will / won't」
（基本例文）彼女は明日、電話をかけ直します。
She'll call back tomorrow.   
私たちは今日の午後の会議には参加しません。
We won't be at the meeting this afternoon.   
夕食後に宿題を終わらせます。
I will finish my homework after dinner.   
明日は学校に行きません。
I won't go to school tomorrow.   
今日の放課後はテニスクラブにはいません。
I won't be at tennis club after school today.   
歯医者に行きますか？ — はい、行きます。歯が痛いんです。
Will you go to the dentist? — Yes, I will. My tooth hurts.   
今日は学校に来ますか？ — いいえ、行きません。今日は少し具合が悪いです。
Will you come to school today? — No, I won't. I'm feeling a little sick today.   
会議はいつ始まりますか？ — 数分後に始まります。
When will the meeting start? — It'll start in a few minutes.   
【練習問題：will / won't】
ご主人のフライトが遅れています。彼は6時前には空港から到着しないでしょう。
Your husband's flight is delayed. He won't arrive from the airport before 6:00.   
電話会議は、明日のベルリン時間3時に始まります。
The conference call will start at 3:00 tomorrow Berlin time.

明日、私はオフィスに早く出社しなければなりませんか？
Will I have to come into the office early tomorrow?   
会議の後、誰が私たちを空港まで車で送ってくれますか？
Who will drive us to the airport after the meeting?   
マリー・シルズから電話がありました。彼女は今夜7時に電話をかけ直します。
Marie Sills called. She'll call back this evening at 7:00.   
明日の朝、どこで私たちと待ち合わせしますか？

Part 2: Unit 4 — 「will」と「be going to」の使い分け
【予測：どちらもOK】   
明日は雨が降るでしょう。
It'll rain tomorrow. / It's going to rain tomorrow.   
【すでに決まっている予定：be going to】   
来月、タイに旅行する予定です！
We are going to travel to Thailand next month!   
空港へはタクシーで行く予定ですか？ — いいえ。車を運転していく予定です。
Are you going to take a taxi to the airport? — No. I'm going to drive.   
冬休みの予定はありますか？ — はい、あります。母と私は北海道を旅行する予定です。
Do you have any plans for winter vacation? — Yes, I do. My mom and I are going to travel in Hokkaido.   
【その場で決めたこと・意志：will】   
たぶん車で空港に行きます。
Maybe I'll drive to the airport.   
今回は私が夕食代を払います。
I will pay for dinner this time.   
私が映画のチケット代を払います。
I will pay for the movie tickets.   
それなら、私がスナックと飲み物代を払いますね。
Then, I'll pay for the snacks and drinks.   
空港シャトルバスの代金は払いますが、Wi-Fiの代金は払いません。
I'll pay for the airport shuttle, but I won't pay for the Wi-Fi.   
【練習問題：会話】
休暇にどこへ行くか決めましたか？ — はい。私たちはスペインに行く予定です！
Have you decided where you are going on your vacation? — Yes, we have. We are going to go to Spain!   
わあ！いつ出発する予定ですか？ — 15日に飛行機で出発する予定です。
Wow! When are you going to leave? — We are going to fly out on the 15th.   
素晴らしいですね。どこに泊まる予定ですか？ — まだ分かりません。向こうに着いたときに何か見つけると思います。
That's fantastic. Where are you going to stay? — I don't know yet. I guess we will find something when we get there.   
【追加練習問題：will vs. be going to】
パンが全然ありませんね。 — ええ、知っています。いくつか買ってくる予定です。あなたの財布からお金を少し取りました。

Why do you need to borrow my suitcase? — Because I'm going to visit my mother in Scotland next month.   
すごく寒いです。 — 暖房をつけますね。
I'm really cold. — I'll turn the heating on.   
大学を卒業した後の予定は何ですか？ — アフリカの病院で働く予定です。
What are your plans after you leave university? — I'm going to work in a hospital in Africa.   
照明が全部消えてしまいました！ — 心配しないで。私がちょっと見てみます。
All the lights have gone off! — Don't worry. I'll take a look.   
なぜノートパソコンを持ち歩いているのですか？ — 電車の中で宿題をする予定なんです。
Why are you carrying your laptop? — I'm going to do some homework on the train.   
鍵が見つかりません。 — 探すのを手伝いますよ。
I can't find my keys. — I'll help you look for them.   
チケットを買うのを覚えていましたか？ — ああ、いけない、忘れていました！今すぐオンラインで買います。
Did you remember to buy the tickets? — Oh no, I forgot! I'll buy them online now.

Part 3: Unit 4 — リアル条件文（The Real Conditional）
※ルール：If節の中では未来のことでも現在形を使う。If節が先ならカンマを入れ、後ろならカンマは不要。  
 【基本＆未来の結果：If + 現在形, will + 動詞の原形】   
 もし彼が勉強すれば、彼の英語は上達するでしょう。
If he studies, his English will improve.   
もし雨が降れば、私は傘を持っていきます。
If it rains, I will bring an umbrella.   
もし彼が正午前にお電話をすれば、彼女はまだ家にいるでしょう。
If he calls her before noon, she'll still be home.   
もし勉強すれば、テストに合格するでしょう。
If you study, you will pass the test.   
もし夜更かしをすれば、明日は疲れているでしょう。
If I stay up late, I will be tired tomorrow.   
明日は疲れているでしょう、もし夜更かしをすれば。
I will be tired tomorrow if I stay up late.   
【事実としての結果：If + 現在形, 現在形】   
スイートを予約すると、リビングルームが付いてきます。
If you reserve a suite, you get a living room.   
氷を熱すると、それは溶けます。
If you heat ice, it melts.

Who do we call if we have questions about local transportation?

Part 4: Unit 5 — 数量詞（Quantifiers: some, any, a lot of, lots of, many, much）
※ルール：肯定文・勧誘（Offer）・依頼（Request）は「some」。
否定文は「any」。
「a lot of / lots of」は数えられる名詞・数えられない名詞どちらにも使える。
「many」は数えられる名詞の複数形、
「much」は数えられない名詞の否定文で主に使う。   
【基本例文：some / any】   
彼女は夕食のためにいくつかの材料を買いました。
She bought some ingredients for dinner.   
私は現金を全く持っていません。
I don't have any cash with me.   
フライドポテトはありますか？
Do you have any fries?   
ご飯はいかがですか？ — はい、お願いします。全く持っていないんです。
Do you want some rice? — Yes, please. I don't have any.   
【オファー（勧める）とリクエスト（頼む）：疑問文でも some】   
日焼け止めはいかがですか？
Would you like some sunscreen?   
ヘアジェルは欲しいですか？
Do you want some hair gel?   
日焼け止めをもらえますか？家に忘れてしまいました。
Can I have some sunscreen? I forgot mine at home.   
シャンプーを買ってきてくれますか？ちょうど切らしてしまったんです。
Could you buy some shampoo? We just ran out.   
【基本例文：a lot of / lots of / many / much】   
彼はたくさんの本を持っています。
He has a lot of books. / He has lots of books.   
ヘアスプレーをたくさん持っていますか？
Do you have a lot of hairspray? / Do you have lots of hairspray?   
そのお店にはあまり多くのブランドのローションはありません。
The store doesn't have many brands of lotion.   
昼食を買いたかったのですが、今日はあまり多くのものがありません。
I wanted to buy lunch, but they don't have many things today.   
歯磨き粉もあまりたくさんありません。
It doesn't have much toothpaste either.   
宿題を終わらせないといけないので、テレビを見る時間はあまりありません。
I need to finish my homework, so I don't have much time to watch TV.   
カミソリはどうですか？いくつかありますか？ — はい、たくさんあります。
How about razors? Do you have any? — Yes, I have lots.

I have some lotion if you need it. — Actually, I looked, and there wasn't any in there.   
化粧品は何か持ってきましたか？ — ああ、いいえ。忘れてしまいました。
Did you bring any makeup with you? — Oh, no. I forgot it.   
お店に行ったら、デンタルフロスをいくつか買ってきてください。 — わかりました。リストに追加しました。
Please get some dental floss when you go to the store. — OK. I added that to my list.

<script>
  const rawData = document.getElementById('rawData').value;
  const contentDiv = document.getElementById('content');
  const tocDiv = document.getElementById('toc');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const englishOnlyCheckbox = document.getElementById('englishOnly');
  const infiniteLoopCheckbox = document.getElementById('infiniteLoop');
  const speedSelect = document.getElementById('speed');
  
  const enVoiceSelect = document.getElementById('enVoiceSelect');
  const jaVoiceSelect = document.getElementById('jaVoiceSelect');

  let isPlaying = false;
  let currentIndex = 0;
  const lineData = [];
  let availableVoices = [];
  let sectionIndex = 0;

  function isJapanese(text) {
    return /[぀-ゟ゠-ヿ一-龯]/.test(text);
  }

  const lines = rawData.split('\n').map(l => l.trim());
  lines.forEach((line) => {
    if (!line) return;
    const p = document.createElement('div');
    p.className = 'line';
    p.textContent = line;

    if (/^【.*】$/.test(line)) {
      const sId = 'section-' + sectionIndex;
      p.id = sId;
      p.className += ' section-header'; 
      p.style.fontWeight = 'bold';
      p.style.marginTop = '20px';
      p.style.fontSize = '1.2em';
      
      const tocBtn = document.createElement('a');
      tocBtn.className = 'toc-btn';
      tocBtn.textContent = line.replace(/【|】/g, '').split(' / ')[0]; 
      tocBtn.onclick = () => {
        document.getElementById(sId).scrollIntoView({ behavior: 'smooth' });
        const targetIndex = lineData.findIndex(item => item.el === p);
        if (targetIndex !== -1) {
            currentIndex = targetIndex;
            if (isPlaying) {
                window.speechSynthesis.cancel();
                speakNext();
            } else {
                lineData.forEach(item => item.el.classList.remove('playing'));
                p.classList.add('playing');
            }
        }
      };
      tocDiv.appendChild(tocBtn);
      sectionIndex++;
      
      contentDiv.appendChild(p);
      lineData.push({ text: line, el: p, isJp: true }); 
      return; 
    }

    if (isJapanese(line)) {
      p.classList.add('japanese');
    } else {
      p.classList.add('english');
    }

    contentDiv.appendChild(p);
    lineData.push({ text: line, el: p, isJp: isJapanese(line) });
  });

  if (sectionIndex === 0) {
      tocDiv.style.display = 'none';
  }

  function populateVoiceList() {
    availableVoices = window.speechSynthesis.getVoices();
    enVoiceSelect.innerHTML = '';
    jaVoiceSelect.innerHTML = '';

    availableVoices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${voice.name} (${voice.lang})`;

      if (voice.lang.startsWith('en')) {
        enVoiceSelect.appendChild(option);
      }
      if (voice.lang.startsWith('ja')) {
        jaVoiceSelect.appendChild(option);
      }
    });

    selectBestVoice(enVoiceSelect, ['Natural', 'Online', 'Google UK', 'Google US']);
    selectBestVoice(jaVoiceSelect, ['Nanami', 'Keita', 'Natural', 'Online', 'Google 日本語']);
  }

  function selectBestVoice(selectElement, preferredNames) {
    const options = Array.from(selectElement.options);
    for (let name of preferredNames) {
      const match = options.find(opt => opt.textContent.includes(name));
      if (match) {
        selectElement.value = match.value;
        return;
      }
    }
  }

  populateVoiceList();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = populateVoiceList;
  }

  function speakNext() {
    if (!isPlaying) return;
    
    // Check if we reached the end
    if (currentIndex >= lineData.length) {
        if (infiniteLoopCheckbox.checked) {
            currentIndex = 0; // Loop back to start
        } else {
            isPlaying = false;
            playBtn.textContent = '▶ 再生';
            lineData.forEach(item => item.el.classList.remove('playing'));
            return;
        }
    }

    const currentItem = lineData[currentIndex];

    if (/^【.*】$/.test(currentItem.text) || (englishOnlyCheckbox.checked && currentItem.isJp)) {
      currentIndex++;
      speakNext();
      return;
    }

    lineData.forEach(item => item.el.classList.remove('playing'));
    currentItem.el.classList.add('playing');
    
    currentItem.el.scrollIntoView({ behavior: 'smooth', block: 'center' });

    let textToSpeak = currentItem.text;
    if (currentItem.isJp) {
        textToSpeak = textToSpeak.replace(/^[0-9]+\.\s*/, '');
    }

    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.rate = parseFloat(speedSelect.value);

    if (currentItem.isJp && jaVoiceSelect.value) {
      utterance.voice = availableVoices[jaVoiceSelect.value];
    } else if (!currentItem.isJp && enVoiceSelect.value) {
      utterance.voice = availableVoices[enVoiceSelect.value];
    } else {
      utterance.lang = currentItem.isJp ? 'ja-JP' : 'en-US';
    }

    utterance.onend = () => {
      currentIndex++;
      speakNext();
    };

    utterance.onerror = (e) => {
      console.warn("読み上げエラー:", e);
      currentIndex++;
      speakNext();
    };

    window.speechSynthesis.speak(utterance);
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) {
        window.speechSynthesis.pause();
        isPlaying = false;
        playBtn.textContent = '▶ 再開';
    } else {
        isPlaying = true;
        playBtn.textContent = '⏸ 一時停止';
        
        if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
        } else {
            if (currentIndex >= lineData.length) currentIndex = 0;
            speakNext();
        }
    }
  });

  stopBtn.addEventListener('click', () => {
    isPlaying = false;
    window.speechSynthesis.cancel();
    playBtn.textContent = '▶ 再生';
    lineData.forEach(item => item.el.classList.remove('playing'));
    currentIndex = 0; // Reset index when stopped
  });

  window.addEventListener('beforeunload', () => {
    window.speechSynthesis.cancel();
  });

</script>
</body>
</html>
