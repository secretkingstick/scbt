<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice English Flashcards</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
        }
        .fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse-shadow {
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(79, 70, 229, 0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between p-4 sm:p-6">

    <!-- Header -->
    <header class="max-w-2xl mx-auto w-full flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-md">
                <i class="fa-solid fa-headphones"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-lg leading-tight">英会話ボイス単語帳</h1>
                <p class="text-xs text-slate-500">リスニング＆フレーズ練習</p>
            </div>
        </div>

        <!-- Voice Settings Button -->
        <button onclick="toggleSettingsModal()" class="p-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl shadow-sm text-sm font-semibold flex items-center gap-2 transition-all">
            <i class="fa-solid fa-sliders text-indigo-600"></i>
            <span>音声設定</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto w-full flex-grow flex flex-col items-center">

        <!-- Progress Bar -->
        <div class="w-full bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col gap-2">
            <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                <span>PROGRESS</span>
                <span id="cardCounter" class="text-indigo-600 font-extrabold text-sm">1 / 12</span>
            </div>
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Flashcard Block -->
        <div class="w-full bg-white rounded-3xl border border-slate-200 shadow-xl p-6 sm:p-8 flex flex-col items-center text-center relative min-h-[400px] justify-between">
            
            <!-- Top Badge -->
            <div class="w-full flex justify-between items-center border-b border-slate-100 pb-4">
                <span id="statusBadge" class="px-3 py-1 text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200/80 rounded-full flex items-center gap-1.5">
                    <i class="fa-solid fa-eye-slash text-amber-500"></i> テキスト非表示中 (音声を聞いて考えよう)
                </span>
                <span class="text-xs text-slate-400 font-medium">Listening First</span>
            </div>

            <!-- Listening Buttons / Answer Reveal Section -->
            <div class="w-full my-6 flex flex-col items-center justify-center flex-grow">
                
                <!-- Voice Prompt Buttons (Step 1) -->
                <div id="listenPromptBox" class="w-full flex flex-col items-center gap-4 py-2">
                    <p class="text-xs font-bold uppercase tracking-wider text-indigo-500">Step 1: 英語で定義を聞く</p>
                    
                    <!-- Primary Audio Button -->
                    <button onclick="speakDefinition()" class="w-full sm:w-4/5 py-4 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-2xl font-bold shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-3 text-base pulse-shadow">
                        <i class="fa-solid fa-volume-high text-xl"></i>
                        <span>🔊 英語の意味（ヒント）を聞く</span>
                    </button>

                    <!-- Answer Voice Preview Button -->
                    <button onclick="speakPhrase()" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold underline underline-offset-4 flex items-center gap-1.5 mt-2">
                        <i class="fa-solid fa-circle-play"></i> 答えの音声だけ先に聞く
                    </button>
                </div>

                <!-- Answer Details Section (Initially Hidden) -->
                <div id="answerSection" class="w-full hidden fade-in flex-col items-center gap-5 pt-2">
                    
                    <!-- English Definition -->
                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 w-full text-left">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs font-bold text-indigo-600 uppercase">English Meaning</span>
                            <button onclick="speakDefinition()" class="text-xs bg-indigo-50 text-indigo-600 font-semibold px-2.5 py-1 rounded-md hover:bg-indigo-100">
                                <i class="fa-solid fa-volume-high"></i> 再生
                            </button>
                        </div>
                        <p id="cardDefinition" class="text-base text-slate-800 font-medium leading-relaxed">--</p>
                    </div>

                    <!-- Target Phrase Answer -->
                    <div class="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-5 w-full text-center">
                        <span class="text-xs font-bold text-emerald-600 uppercase block mb-1">Answer Phrase</span>
                        <h2 id="cardPhrase" class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">--</h2>
                        <p id="cardJapanese" class="text-sm font-bold text-slate-600 bg-white inline-block px-3 py-1 rounded-lg border border-indigo-100 shadow-sm mb-4">--</p>
                        
                        <div>
                            <button onclick="speakPhrase()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all inline-flex items-center gap-2">
                                <i class="fa-solid fa-volume-high"></i> 答えの音声を聞く
                            </button>
                        </div>
                    </div>

                </div>

            </div>

            <!-- Bottom Reveal Button -->
            <div class="w-full border-t border-slate-100 pt-4">
                <button id="revealBtn" onclick="revealAnswer()" class="w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-eye"></i> 答えを表示する (Show Answer)
                </button>
            </div>

        </div>

        <!-- Navigation Buttons -->
        <div class="flex items-center justify-between w-full mt-6">
            <button onclick="prevCard()" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold rounded-xl shadow-sm transition-all flex items-center gap-2 text-sm">
                <i class="fa-solid fa-arrow-left"></i> 前へ
            </button>
            <button onclick="nextCard()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition-all flex items-center gap-2 text-sm">
                次へ <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </main>

    <!-- Modal: Voice Settings -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl flex flex-col gap-5">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-indigo-600"></i> 音声設定 (Voice Quality)
                </h3>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="flex flex-col gap-4 text-xs font-semibold text-slate-600">
                <div>
                    <label class="block mb-1 text-slate-700">使用する音声モデル (英語):</label>
                    <select id="voiceSelect" onchange="changeVoice()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-normal text-slate-800 focus:outline-indigo-600">
                    </select>
                    <p class="text-[10px] text-slate-400 mt-1">※ Natural, Google, Samantha などのボイスがより自然です。</p>
                </div>

                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-slate-700">話すスピード:</label>
                        <span id="speedVal" class="text-indigo-600 font-bold">0.9x</span>
                    </div>
                    <input type="range" id="speedRange" min="0.5" max="1.2" step="0.05" value="0.9" oninput="updateSpeed(this.value)" class="w-full accent-indigo-600">
                </div>
            </div>

            <button onclick="toggleSettingsModal()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition-all">
                設定を閉じる
            </button>
        </div>
    </div>

    <!-- Script -->
    <script>
        const phrasesData = [
            { phrase: "I'm with you.", definition: "You agree with someone's opinion or decision.", japanese: "賛成です" },
            { phrase: "It costs an arm and a leg.", definition: "Something is extremely expensive.", japanese: "とても費用がかかる" },
            { phrase: "A good point.", definition: "An important, helpful, or convincing argument or detail.", japanese: "良い指摘" },
            { phrase: "I like my privacy.", definition: "You prefer to spend time by yourself.", japanese: "1人で過ごすのが好き" },
            { phrase: "The fine print.", definition: "The detailed conditions or small text in a contract or agreement.", japanese: "細かい注意書き" },
            { phrase: "A fee.", definition: "An amount of money you pay for a service or professional advice.", japanese: "料金です" },
            { phrase: "Making small talk.", definition: "Having a polite conversation about everyday, light subjects.", japanese: "雑談をする" },
            { phrase: "It's got a lot of downsides.", definition: "Something has many disadvantages or negative aspects.", japanese: "多くのデメリットがある" },
            { phrase: "While we're at it.", definition: "Doing something extra at the same time as the current activity.", japanese: "ついでに" },
            { phrase: "I don't care.", definition: "It makes no difference to you, or you have no strong preference.", japanese: "気にしない" },
            { phrase: "I'll take the plunge.", definition: "You decide to do something risky, big, or tough after hesitation.", japanese: "思い切ってやってみる" },
            { phrase: "Go for it!", definition: "You encourage someone to pursue a goal or take action.", japanese: "頑張って" }
        ];

        let currentIndex = 0;
        let selectedVoice = null;
        let speechRate = 0.9;

        // Load Card
        function loadCard(index) {
            window.speechSynthesis.cancel();

            if (index < 0) index = phrasesData.length - 1;
            if (index >= phrasesData.length) index = 0;

            currentIndex = index;
            const data = phrasesData[currentIndex];

            // Set Content
            document.getElementById('cardCounter').textContent = `${currentIndex + 1} / ${phrasesData.length}`;
            document.getElementById('progressBar').style.width = `${((currentIndex + 1) / phrasesData.length) * 100}%`;

            document.getElementById('cardDefinition').textContent = data.definition;
            document.getElementById('cardPhrase').textContent = data.phrase;
            document.getElementById('cardJapanese').textContent = data.japanese;

            // Hide Answer Section
            document.getElementById('answerSection').classList.add('hidden');
            document.getElementById('answerSection').classList.remove('flex');
            document.getElementById('revealBtn').classList.remove('hidden');

            // Reset Badge
            const badge = document.getElementById('statusBadge');
            badge.className = "px-3 py-1 text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200/80 rounded-full flex items-center gap-1.5";
            badge.innerHTML = `<i class="fa-solid fa-eye-slash text-amber-500"></i> テキスト非表示中 (音声を聞いて考えよう)`;
        }

        // Voice Engine Initialization with Priority High-Quality Voice Selection
        function initVoices() {
            const voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
            const select = document.getElementById('voiceSelect');
            select.innerHTML = '';

            if (voices.length === 0) return;

            // Prioritize natural voices
            const preferredNames = ['Natural', 'Google US English', 'Samantha', 'Karen', 'Daniel', 'Premium', 'Enhanced'];
            
            voices.sort((a, b) => {
                let scoreA = preferredNames.findIndex(p => a.name.includes(p));
                let scoreB = preferredNames.findIndex(p => b.name.includes(p));
                if (scoreA === -1) scoreA = 99;
                if (scoreB === -1) scoreB = 99;
                return scoreA - scoreB;
            });

            voices.forEach((v, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${v.name} (${v.lang})`;
                select.appendChild(opt);
            });

            selectedVoice = voices[0];
        }

        window.speechSynthesis.onvoiceschanged = initVoices;

        function changeVoice() {
            const voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
            const index = document.getElementById('voiceSelect').value;
            selectedVoice = voices[index];
        }

        function updateSpeed(val) {
            speechRate = parseFloat(val);
            document.getElementById('speedVal').textContent = `${speechRate}x`;
        }

        // Speech Functions
        function speakDefinition() {
            window.speechSynthesis.cancel();
            const text = phrasesData[currentIndex].definition;
            const utter = new SpeechSynthesisUtterance(text);
            if (selectedVoice) utter.voice = selectedVoice;
            utter.rate = speechRate;
            utter.pitch = 1.0;
            window.speechSynthesis.speak(utter);
        }

        function speakPhrase() {
            window.speechSynthesis.cancel();
            const text = phrasesData[currentIndex].phrase;
            const utter = new SpeechSynthesisUtterance(text);
            if (selectedVoice) utter.voice = selectedVoice;
            utter.rate = speechRate;
            utter.pitch = 1.0;
            window.speechSynthesis.speak(utter);
        }

        // Reveal Answer Text
        function revealAnswer() {
            document.getElementById('answerSection').classList.remove('hidden');
            document.getElementById('answerSection').classList.add('flex');
            document.getElementById('revealBtn').classList.add('hidden');

            const badge = document.getElementById('statusBadge');
            badge.className = "px-3 py-1 text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200/80 rounded-full flex items-center gap-1.5";
            badge.innerHTML = `<i class="fa-solid fa-check text-emerald-500"></i> テキスト表示済み`;
        }

        // Modal Controls
        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        function nextCard() { loadCard(currentIndex + 1); }
        function prevCard() { loadCard(currentIndex - 1); }

        window.onload = function() {
            initVoices();
            loadCard(0);
        };
    </script>
</body>
</html>
